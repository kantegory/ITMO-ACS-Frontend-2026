<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сообщения и сделки — Аренда жилья</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Перейти к основному содержимому</a>

  <header>
    <nav class="navbar navbar-expand-lg bg-white border-bottom" aria-label="Основное меню">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Аренда жилья</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Поиск</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="messages.html">Сообщения</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
          </ul>
          <div id="guestActions" hidden>
            <a class="btn btn-outline-primary me-2" href="login.html">Вход</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
          <div id="userActions" hidden>
            <span class="navbar-text me-3" id="userName"></span>
            <button class="btn btn-outline-secondary" type="button" id="logout">Выйти</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1" class="container py-4">
    <h1 class="h2 mb-4">Сообщения</h1>
    <p id="error" role="alert" hidden></p>

    <div class="row g-4 mb-5">
      <div class="col-md-4">
        <h2 class="visually-hidden" id="conversationsTitle">Диалоги</h2>
        <div class="list-group" id="conversations" role="group" aria-labelledby="conversationsTitle"></div>
        <p class="text-muted" id="noConversations" hidden>Диалогов пока нет. Напишите владельцу со страницы объекта.</p>
      </div>

      <div class="col-md-8">
        <div class="card" id="chatCard" hidden>
          <h2 class="card-header bg-white fw-bold fs-6 m-0" id="chatName"></h2>
          <div class="card-body chat d-flex flex-column gap-2" id="chat" role="log" aria-labelledby="chatName" tabindex="0"></div>
          <div class="card-footer bg-white">
            <form class="d-flex gap-2" id="messageForm" aria-label="Новое сообщение">
              <label class="visually-hidden" for="messageText">Текст сообщения</label>
              <input type="text" class="form-control" id="messageText" name="text" placeholder="Введите сообщение" autocomplete="off" required>
              <button type="submit" class="btn btn-primary">Отправить</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <h2 class="h3 mb-3" id="dealsTitle">История сделок</h2>
    <div class="table-responsive" role="region" aria-labelledby="dealsTitle" tabindex="0">
      <table class="table table-striped bg-white" aria-labelledby="dealsTitle">
        <thead>
          <tr>
            <th scope="col">Дата</th>
            <th scope="col">Объект</th>
            <th scope="col">Роль</th>
            <th scope="col">Сумма в месяц</th>
            <th scope="col">Статус</th>
          </tr>
        </thead>
        <tbody id="deals"></tbody>
      </table>
    </div>
    <p class="text-muted" id="noDeals" hidden>Сделок пока нет.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/messages.js"></script>
</body>
</html>
