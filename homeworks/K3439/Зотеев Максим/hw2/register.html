<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Аренда жилья</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Перейти к основному содержимому</a>

  <header>
    <nav class="navbar navbar-expand-lg bg-white border-bottom" aria-label="Основное меню">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Аренда жилья</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Поиск</a></li>
            <li class="nav-item"><a class="nav-link" href="messages.html">Сообщения</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
          </ul>
          <div id="guestActions" hidden>
            <a class="btn btn-outline-primary me-2" href="login.html">Вход</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
          <div id="userActions" hidden>
            <span class="navbar-text me-3" id="userName"></span>
            <button class="btn btn-outline-secondary" type="button" id="logout">Выйти</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Регистрация</h1>
            <p id="formError" role="alert" hidden></p>
            <p class="text-muted small">Все поля обязательны для заполнения.</p>
            <form id="registerForm">
              <div class="row">
                <div class="col-sm-6 mb-3">
                  <label for="firstName" class="form-label">Имя</label>
                  <input type="text" class="form-control" id="firstName" name="firstName" autocomplete="given-name" required>
                </div>
                <div class="col-sm-6 mb-3">
                  <label for="lastName" class="form-label">Фамилия</label>
                  <input type="text" class="form-control" id="lastName" name="lastName" autocomplete="family-name" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label">Телефон</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="+7 900 000-00-00" autocomplete="tel" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" minlength="6" autocomplete="new-password" aria-describedby="passwordHelp" required>
                <div class="form-text" id="passwordHelp">Не менее 6 символов</div>
              </div>
              <fieldset class="mb-3">
                <legend class="form-label fs-6 mb-1">Я хочу</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="role" id="tenant" value="tenant" checked>
                  <label class="form-check-label" for="tenant">снять жильё</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="role" id="owner" value="owner">
                  <label class="form-check-label" for="owner">сдать жильё</label>
                </div>
              </fieldset>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                <label class="form-check-label" for="agree">Согласен с правилами сервиса</label>
              </div>
              <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
            </form>
            <p class="text-center mt-3 mb-0">
              Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/register.js"></script>
</body>
</html>
