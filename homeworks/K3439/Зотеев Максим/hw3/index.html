<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Поиск жилья — Аренда жилья</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/themes/light.css" rel="stylesheet" media="(prefers-color-scheme: light)">
  <link href="css/themes/dark.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Перейти к основному содержимому</a>

  <header>
    <nav class="navbar navbar-expand-lg bg-body border-bottom" aria-label="Основное меню">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Аренда жилья</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Поиск</a></li>
            <li class="nav-item"><a class="nav-link" href="messages.html">Сообщения</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
          </ul>
          <div id="guestActions" hidden>
            <a class="btn btn-outline-primary me-2" href="login.html">Вход</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
          <div id="userActions" hidden>
            <span class="navbar-text me-3" id="userName"></span>
            <button class="btn btn-outline-secondary" type="button" id="logout">Выйти</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1" class="container py-4">
    <h1 class="h2 mb-4">Поиск жилья</h1>

    <div class="row">
      <div class="col-lg-3 mb-4">
        <form id="filters" class="card card-body" role="search" aria-labelledby="filtersTitle">
          <h2 class="h5 mb-3" id="filtersTitle">Фильтры</h2>
          <div class="mb-3">
            <label for="type" class="form-label">Тип жилья</label>
            <select id="type" class="form-select">
              <option value="">Любой</option>
              <option value="Квартира">Квартира</option>
              <option value="Студия">Студия</option>
              <option value="Комната">Комната</option>
              <option value="Дом">Дом</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="city" class="form-label">Город</label>
            <select id="city" class="form-select">
              <option value="">Любой</option>
              <option value="Санкт-Петербург">Санкт-Петербург</option>
              <option value="Москва">Москва</option>
              <option value="Казань">Казань</option>
              <option value="Сочи">Сочи</option>
            </select>
          </div>
          <fieldset class="mb-3">
            <legend class="form-label fs-6">Цена, ₽ в месяц</legend>
            <div class="input-group">
              <input type="number" id="priceMin" class="form-control" placeholder="от" min="0" aria-label="Цена от, рублей">
              <input type="number" id="priceMax" class="form-control" placeholder="до" min="0" aria-label="Цена до, рублей">
            </div>
          </fieldset>
          <button type="submit" class="btn btn-primary mb-2">Показать</button>
          <button type="reset" class="btn btn-outline-secondary">Сбросить</button>
        </form>
      </div>

      <section class="col-lg-9" aria-labelledby="resultsTitle">
        <h2 class="visually-hidden" id="resultsTitle">Результаты поиска</h2>
        <p class="text-muted" role="status">Найдено объявлений: <span id="count">0</span></p>
        <p id="loading" class="text-muted" role="status">Загрузка объявлений…</p>
        <p id="error" role="alert" hidden></p>
        <ul class="row g-4 list-unstyled" id="listings"></ul>

        <p id="empty" class="alert alert-warning mt-4" hidden>По вашему запросу ничего не найдено.</p>
      </section>
    </div>
  </main>

  <template id="cardTemplate">
    <li class="col-md-6 col-xl-4">
      <div class="card h-100">
        <img class="card-img-top" alt="" data-field="photo">
        <div class="card-body">
          <span class="badge text-bg-secondary mb-2" data-field="type"></span>
          <h3 class="h5 card-title" data-field="title"></h3>
          <p class="card-text text-muted mb-2" data-field="location"></p>
          <p class="fw-bold fs-5 mb-0" data-field="price"></p>
        </div>
        <div class="card-footer bg-body border-0 pb-3">
          <a class="btn btn-outline-primary w-100" data-field="link">Подробнее</a>
        </div>
      </div>
    </li>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/search.js"></script>
</body>
</html>
