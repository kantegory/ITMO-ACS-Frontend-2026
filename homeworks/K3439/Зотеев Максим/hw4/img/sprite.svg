<svg xmlns="http://www.w3.org/2000/svg">

  <!-- дом: логотип сайта -->
  <symbol id="home" viewBox="0 0 24 24">
    <path d="M3 11 12 3l9 8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 21v-6h4v6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- лупа: поиск -->
  <symbol id="search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7" stroke-width="1.5"/>
    <path d="m20 20-4-4" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- облачко: сообщения -->
  <symbol id="message" viewBox="0 0 24 24">
    <path d="M4 5h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4 3.5V18H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- человек: личный кабинет -->
  <symbol id="user" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4" stroke-width="1.5"/>
    <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- стрелка внутрь: вход -->
  <symbol id="login" viewBox="0 0 24 24">
    <path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 12h12" stroke-width="1.5" stroke-linecap="round"/>
    <path d="m10 7 5 5-5 5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- стрелка наружу: выход -->
  <symbol id="logout" viewBox="0 0 24 24">
    <path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 12h12" stroke-width="1.5" stroke-linecap="round"/>
    <path d="m16 7 5 5-5 5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- метка на карте: адрес -->
  <symbol id="location" viewBox="0 0 24 24">
    <path d="M12 22s8-6.5 8-12.5a8 8 0 0 0-16 0C4 15.5 12 22 12 22z" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="12" cy="9.5" r="2.5" stroke-width="1.5"/>
  </symbol>

  <!-- календарь: запись на просмотр -->
  <symbol id="calendar" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="16" rx="2" stroke-width="1.5"/>
    <path d="M3 10h18" stroke-width="1.5"/>
    <path d="M8 3v4M16 3v4" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- плюс: новое объявление -->
  <symbol id="plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>
</svg>
