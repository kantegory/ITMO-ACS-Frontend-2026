<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Вход — Аренда жилья</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/themes/light.css" rel="stylesheet" media="(prefers-color-scheme: light)">
  <link href="css/themes/dark.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Перейти к основному содержимому</a>

  <header>
    <nav class="navbar navbar-expand-lg bg-body border-bottom" aria-label="Основное меню">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#home"></use></svg> Аренда жилья</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#search"></use></svg> Поиск</a></li>
            <li class="nav-item"><a class="nav-link" href="messages.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#message"></use></svg> Сообщения</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#user"></use></svg> Личный кабинет</a></li>
          </ul>
          <div id="guestActions" hidden>
            <a class="btn btn-outline-primary me-2" href="login.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#login"></use></svg> Вход</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
          <div id="userActions" hidden>
            <span class="navbar-text me-3" id="userName"></span>
            <button class="btn btn-outline-secondary" type="button" id="logout"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#logout"></use></svg> Выйти</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1" class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4 text-center">Вход</h1>
            <p id="formError" role="alert" hidden></p>
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" minlength="6" autocomplete="current-password" required>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="remember" name="remember" checked>
                <label class="form-check-label" for="remember">Запомнить меня</label>
              </div>
              <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
            <p class="text-center mt-3 mb-0">
              Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
