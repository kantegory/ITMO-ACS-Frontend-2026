<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Личный кабинет — Аренда жилья</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/themes/light.css" rel="stylesheet" media="(prefers-color-scheme: light)">
  <link href="css/themes/dark.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
</head>
<body>
  <a class="visually-hidden-focusable skip-link" href="#main">Перейти к основному содержимому</a>

  <header>
    <nav class="navbar navbar-expand-lg bg-body border-bottom" aria-label="Основное меню">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#home"></use></svg> Аренда жилья</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#search"></use></svg> Поиск</a></li>
            <li class="nav-item"><a class="nav-link" href="messages.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#message"></use></svg> Сообщения</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="profile.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#user"></use></svg> Личный кабинет</a></li>
          </ul>
          <div id="guestActions" hidden>
            <a class="btn btn-outline-primary me-2" href="login.html"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#login"></use></svg> Вход</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
          <div id="userActions" hidden>
            <span class="navbar-text me-3" id="userName"></span>
            <button class="btn btn-outline-secondary" type="button" id="logout"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#logout"></use></svg> Выйти</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" tabindex="-1" class="container py-4">
    <p id="notice" role="status" hidden></p>

    <div class="row g-4">
      <div class="col-lg-3">
        <div class="card text-center">
          <div class="card-body">
            <div class="avatar rounded-circle fs-2 mx-auto mb-3" id="avatar" aria-hidden="true"></div>
            <h1 class="h5 mb-1" id="profileName"></h1>
            <p class="text-muted small mb-3"><span id="profileEmail"></span><br><span id="profilePhone"></span></p>
            <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#addModal">
              <svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#plus"></use></svg> Сдать жильё
            </button>
          </div>
        </div>
      </div>

      <div class="col-lg-9">
        <ul class="nav nav-tabs mb-3" role="tablist" aria-label="Разделы личного кабинета">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="rentingTab" data-bs-toggle="tab" data-bs-target="#renting" type="button" role="tab" aria-controls="renting" aria-selected="true">Я арендую</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="owningTab" data-bs-toggle="tab" data-bs-target="#owning" type="button" role="tab" aria-controls="owning" aria-selected="false">Я сдаю</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="settingsTab" data-bs-toggle="tab" data-bs-target="#settings" type="button" role="tab" aria-controls="settings" aria-selected="false">Настройки</button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- Арендованные объекты -->
          <div class="tab-pane fade show active" id="renting" role="tabpanel" aria-labelledby="rentingTab" tabindex="0">
            <p class="text-muted" id="rentingLoading" role="status">Загрузка…</p>
            <div id="rentingList"></div>
            <p class="text-muted" id="rentingEmpty" hidden>Вы пока ничего не арендуете.</p>
          </div>

          <!-- Сдаваемые объекты -->
          <div class="tab-pane fade" id="owning" role="tabpanel" aria-labelledby="owningTab" tabindex="0">
            <div class="table-responsive" role="region" aria-label="Объекты, которые вы сдаёте" tabindex="0">
              <table class="table table-hover align-middle bg-body">
                <caption class="visually-hidden">Объекты, которые вы сдаёте</caption>
                <thead>
                  <tr>
                    <th scope="col">Объект</th>
                    <th scope="col">Цена</th>
                    <th scope="col">Статус</th>
                    <th scope="col">Арендатор</th>
                  </tr>
                </thead>
                <tbody id="owningList"></tbody>
              </table>
            </div>
            <p class="text-muted" id="owningEmpty" hidden>У вас пока нет объявлений.</p>
          </div>

          <!-- Настройки профиля -->
          <div class="tab-pane fade" id="settings" role="tabpanel" aria-labelledby="settingsTab" tabindex="0">
            <form class="card card-body" id="settingsForm">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="firstName" class="form-label">Имя</label>
                  <input type="text" class="form-control" id="firstName" name="firstName" autocomplete="given-name" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="lastName" class="form-label">Фамилия</label>
                  <input type="text" class="form-control" id="lastName" name="lastName" autocomplete="family-name" required>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="phone" class="form-label">Телефон</label>
                  <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel">
                </div>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="notify" name="notify">
                <label class="form-check-label" for="notify">Получать уведомления о новых сообщениях</label>
              </div>
              <div>
                <button type="submit" class="btn btn-primary">Сохранить</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Модальное окно: новое объявление -->
  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addTitle" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="addForm">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="addTitle">Новое объявление</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="newType" class="form-label">Тип жилья</label>
            <select class="form-select" id="newType" name="type">
              <option>Квартира</option>
              <option>Студия</option>
              <option>Комната</option>
              <option>Дом</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="newCity" class="form-label">Город</label>
            <select class="form-select" id="newCity" name="city">
              <option>Санкт-Петербург</option>
              <option>Москва</option>
              <option>Казань</option>
              <option>Сочи</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="newAddress" class="form-label">Адрес</label>
            <input type="text" class="form-control" id="newAddress" name="address" required>
          </div>
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="newArea" class="form-label">Площадь, м²</label>
              <input type="number" class="form-control" id="newArea" name="area" min="1" required>
            </div>
            <div class="col-sm-6 mb-3">
              <label for="newPrice" class="form-label">Цена, ₽ в месяц</label>
              <input type="number" class="form-control" id="newPrice" name="price" min="0" required>
            </div>
          </div>
          <div class="mb-3">
            <label for="newDescription" class="form-label">Описание</label>
            <textarea class="form-control" id="newDescription" name="description" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary">Опубликовать</button>
        </div>
      </form>
    </div>
  </div>

  <template id="rentalTemplate">
    <div class="card mb-3">
      <div class="row g-0">
        <div class="col-md-4">
          <img class="img-fluid rounded-start h-100 object-fit-cover" alt="" data-field="photo">
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <span class="badge mb-2" data-field="status"></span>
            <h2 class="h5 card-title" data-field="title"></h2>
            <p class="card-text text-muted mb-1"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#location"></use></svg> <span data-field="location"></span></p>
            <p class="card-text mb-1" data-field="period"></p>
            <p class="card-text fw-bold" data-field="price"></p>
            <a class="btn btn-sm btn-outline-primary" data-field="chat"><svg class="icon" aria-hidden="true" focusable="false"><use href="img/sprite.svg#message"></use></svg> Написать владельцу</a>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
