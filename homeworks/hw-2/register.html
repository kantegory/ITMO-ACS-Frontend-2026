<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — TableBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<a class="visually-hidden-focusable" href="#main-content">Перейти к основному содержимому</a>

<header>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#922b21;" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand" href="index.html">TableBook</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Открыть меню навигации">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Поиск ресторанов</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
        </ul>
        <ul class="navbar-nav align-items-lg-center" id="nav-auth-slot"></ul>
      </div>
    </div>
  </nav>
</header>

<main class="container" id="main-content">
  <div class="card shadow-sm auth-card">
    <div class="card-body p-4">
      <h1 class="h3 text-center mb-4">Регистрация</h1>
      <form id="register-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="r-name">Имя</label>
          <input type="text" class="form-control" id="r-name" required aria-describedby="r-name-feedback">
          <div class="invalid-feedback" id="r-name-feedback">Введите ваше имя.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="r-email">Email</label>
          <input type="email" class="form-control" id="r-email" required aria-describedby="r-email-feedback">
          <div class="invalid-feedback" id="r-email-feedback">Введите корректный email.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="r-password">Пароль</label>
          <input type="password" class="form-control" id="r-password" minlength="4" required aria-describedby="r-password-feedback">
          <div class="invalid-feedback" id="r-password-feedback">Пароль должен содержать не менее 4 символов.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="r-password2">Повторите пароль</label>
          <input type="password" class="form-control" id="r-password2" minlength="4" required aria-describedby="r-password2-feedback">
          <div class="invalid-feedback" id="r-password2-feedback">Пароли не совпадают.</div>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="r-terms" required aria-describedby="r-terms-feedback">
          <label class="form-check-label" for="r-terms">Я согласен с условиями использования</label>
          <div class="invalid-feedback" id="r-terms-feedback">Необходимо согласие с условиями.</div>
        </div>
        <div id="register-error" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
        <button type="submit" class="btn btn-brand w-100">Зарегистрироваться</button>
      </form>
      <p class="text-center mt-3 mb-0">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </p>
    </div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
