<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск сотрудников - FinderJobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="visually-hidden-focusable" href="#main-content">Перейти к основному содержимому</a>
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">FinderJobs</a>
                <a class="btn btn-outline-light" href="employer.html">Кабинет работодателя</a>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container py-5">
        <h1 class="mb-4">Поиск сотрудников</h1>
        <section class="card shadow-sm p-4 mb-4">
            <form>
                <div class="row g-3">
                    <div class="col-12 col-md-5">
                        <label for="candidateQuery" class="form-label">Навык или должность</label>
                        <input id="candidateQuery" class="form-control" type="search" placeholder="Например, frontend">
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="candidateExperience" class="form-label">Опыт</label>
                        <select id="candidateExperience" class="form-select">
                            <option>Любой опыт</option>
                            <option>Без опыта</option>
                            <option>От 1 года</option>
                            <option>От 3 лет</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-3 d-flex align-items-end">
                        <button class="btn btn-primary w-100" type="submit">Найти</button>
                    </div>
                </div>
            </form>
        </section>

        <section>
            <h2 class="h3 mb-3">Соискатели</h2>
            <div class="row g-3">
                <div class="col-12 col-md-6 col-lg-4">
                    <article class="card h-100 p-4">
                        <h3 class="h4">Анастасия Маркозубова</h3>
                        <p class="text-muted">Frontend-разработчик</p>
                        <p>HTML, CSS, Bootstrap, JavaScript</p>
                        <a href="profile.html" class="btn btn-outline-primary mt-auto">Открыть резюме</a>
                    </article>
                </div>
                <div class="col-12 col-md-6 col-lg-4">
                    <article class="card h-100 p-4">
                        <h3 class="h4">Иван Петров</h3>
                        <p class="text-muted">QA-инженер</p>
                        <p>Тестирование, Postman, SQL</p>
                        <a href="profile.html" class="btn btn-outline-primary mt-auto">Открыть резюме</a>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-2">
        <p class="mb-0">© 2026 ООО «ФиндерДжобс»</p>
    </footer>
    <script src="js/theme.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
