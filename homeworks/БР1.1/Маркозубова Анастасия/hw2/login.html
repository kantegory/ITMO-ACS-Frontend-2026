<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - FinderJobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a class="visually-hidden-focusable" href="#main-content">Перейти к основному содержимому</a>
    <header>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="index.html">FinderJobs</a>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-4">
                <section class="card shadow-sm p-4">
                    <h1 class="text-center mb-4">Вход</h1>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Почта</label>
                            <input id="email" name="email" type="email" class="form-control" placeholder="example@mail.ru" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input id="password" name="password" type="password" class="form-control" placeholder="Введите пароль" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Войти</button>
                    </form>

                    <div id="loginMessage" class="d-none" role="alert"></div>

                    <p class="text-center mt-4 mb-0">
                        Нет аккаунта?
                        <a href="register.html">Зарегистрироваться</a>
                    </p>

                </section>
            </div>
        </div>
    </main>

    <footer class="text-center py-2">
        <p class="mb-0">© 2026 ООО «ФиндерДжобс»</p>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
