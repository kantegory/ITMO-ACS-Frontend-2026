<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Блог — Вместе</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
</head>
<body data-page="blog">

<a class="skip-link" href="#content">К содержимому</a>

<header class="site-header">
  <div class="container-xl py-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
    <a class="brand" href="index.html">ВМЕСТЕ</a>
    <nav id="siteNav" class="site-nav" aria-label="Основная навигация"></nav>
  </div>
</header>

<noscript>
  <p class="container status">Для работы сайта включи JavaScript.</p>
</noscript>

<main id="content" class="container-xl py-5" tabindex="-1">
  <p class="eyebrow">Практика · питание · отдых</p>

  <h1 class="display-title mb-4">Блог о движении</h1>

  <div
          id="blogFilters"
          class="d-flex flex-wrap gap-3 mb-4"
          role="group"
          aria-label="Темы статей"
  >
    <button
            class="btn btn-brutal btn-paper blog-filter active"
            type="button"
            data-category=""
            aria-pressed="true"
    >
      Все темы
    </button>

    <button
            class="btn btn-brutal btn-paper blog-filter"
            type="button"
            data-category="yoga"
            aria-pressed="false"
    >
      Йога
    </button>

    <button
            class="btn btn-brutal btn-paper blog-filter"
            type="button"
            data-category="food"
            aria-pressed="false"
    >
      Питание
    </button>

    <button
            class="btn btn-brutal btn-paper blog-filter"
            type="button"
            data-category="recovery"
            aria-pressed="false"
    >
      Восстановление
    </button>
  </div>

  <p id="pageStatus" class="status" role="status">
    Загружаем статьи…
  </p>

  <section
          id="articleList"
          class="row g-4"
          aria-label="Список статей"
  ></section>
</main>

<div
        id="articleModal"
        class="modal fade"
        tabindex="-1"
        aria-labelledby="articleTitle"
        aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content brutal-card">
      <div class="modal-header lilac-bg">
        <h2
                id="articleTitle"
                class="modal-title fs-4"
        ></h2>

        <button
                class="btn-close"
                type="button"
                data-bs-dismiss="modal"
                aria-label="Закрыть статью"
        ></button>
      </div>

      <div
              id="articleBody"
              class="modal-body p-4"
              aria-live="polite"
      ></div>

      <div class="modal-footer">
        <button
                class="btn btn-brutal btn-lilac"
                type="button"
                data-bs-dismiss="modal"
        >
          Закрыть
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
