<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Вместе</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
</head>
<body data-page="login">

<a class="skip-link" href="#content">К содержимому</a>

<header class="site-header">
  <div class="container-xl py-3 d-flex flex-wrap align-items-center justify-content-between gap-3">
    <a class="brand" href="index.html">ВМЕСТЕ</a>
    <nav id="siteNav" class="site-nav" aria-label="Основная навигация"></nav>
  </div>
</header>

<noscript>
  <p class="container status">Для работы сайта включи JavaScript.</p>
</noscript>

<main id="content" class="container-xl py-5" tabindex="-1">
  <section class="brutal-card p-4 p-md-5 auth-wrap mx-auto">
    <p class="eyebrow">Рады видеть тебя снова</p>

    <h1 id="authTitle" class="display-title">Войти</h1>

    <p>Войди, чтобы открыть личный план и комнату занятия.</p>

    <form
            id="authForm"
            class="needs-validation mt-4"
            aria-labelledby="authTitle"
            novalidate
    >
      <div class="mb-3">
        <label class="form-label" for="email">Почта</label>
        <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
        >
        <div id="emailError" class="invalid-feedback">
          Введи корректную почту.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Пароль</label>
        <input
                class="form-control"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="6"
                required
                aria-describedby="passwordHint"
        >
        <p id="passwordHint" class="form-text">
          Минимум 6 символов.
        </p>

        <div id="passwordError" class="invalid-feedback">
          Введи пароль длиной не менее 6 символов.
        </div>
      </div>

      <button class="btn btn-brutal btn-clay w-100" type="submit">
        Войти
      </button>

      <p
              id="formStatus"
              class="status"
              role="status"
              aria-live="polite"
              aria-atomic="true"
              tabindex="-1"
      ></p>
    </form>

    <p class="mt-4 mb-0">
      Нет аккаунта?
      <a id="otherAuth" href="register.html">Создать аккаунт</a>
    </p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
