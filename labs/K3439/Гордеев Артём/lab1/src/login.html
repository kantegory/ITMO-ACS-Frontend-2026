<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход в систему - Отравись-ка</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Кастомные стили -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-egg-fried fs-3 me-2 text-danger"></i>
        <span>Отравись-ка</span>
      </a>
      <div>
        <a href="index.html" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i>В каталог
        </a>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="card auth-card shadow-sm p-4 bg-white">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-3 mb-2">
            <i class="bi bi-person-lock fs-2"></i>
          </div>
          <h3 class="fw-bold">Авторизация</h3>
          <p class="text-muted small">Войдите в свой аккаунт для сохранения рецептов и публикации блюд</p>
        </div>

        <form class="needs-validation" novalidate action="profile.html">
          <div class="mb-3">
            <label for="login-email" class="form-label">Электронная почта или логин</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="login-email" placeholder="ivan.smirnov@example.com" required>
              <div class="invalid-feedback">Пожалуйста, введите корректный адрес почты.</div>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between">
              <label for="login-password" class="form-label">Пароль</label>
              <a href="#" class="small text-decoration-none text-danger">Забыли пароль?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
              <div class="invalid-feedback">Пожалуйста, укажите ваш пароль.</div>
            </div>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="remember-me" checked>
            <label class="form-check-label small text-secondary" for="remember-me">Запомнить меня на этом устройстве</label>
          </div>

          <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
            Войти в аккаунт
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <span class="small text-muted">Еще нет аккаунта?</span>
          <a href="register.html" class="small text-danger fw-semibold text-decoration-none ms-1">Зарегистрироваться</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-auto">
    <div class="container text-center text-muted small">
      &copy; 2026 Отравись-ка.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
