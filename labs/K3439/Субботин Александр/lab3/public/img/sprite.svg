<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    SVG-спрайт «Столика»: все иконки сайта в одном файле.
    Подключение: <svg class="icon" aria-hidden="true"><use href="img/sprite.svg#star"></use></svg>
    Цвета в символах не заданы: обводка и заливка наследуются от .icon (stroke: currentColor),
    поэтому иконка берёт цвет текста вокруг и сама меняется вместе с темой.
  -->

  <!-- Логотип «Столика»: клош — блюдо под крышкой -->
  <symbol id="logo" viewBox="0 0 24 24">
    <path d="M3 18h18M5 18a7 7 0 0 1 14 0M12 11V8M10 8h4"/>
  </symbol>

  <!-- Поиск — лупа -->
  <symbol id="search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
  </symbol>

  <!-- Фильтры — воронка из полосок -->
  <symbol id="filter" viewBox="0 0 24 24">
    <path d="M4 6h16M7 12h10M10 18h4"/>
  </symbol>

  <!-- Звезда рейтинга (используется с классом icon-fill) -->
  <symbol id="star" viewBox="0 0 24 24">
    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
  </symbol>

  <!-- Адрес, район, зона в зале -->
  <symbol id="pin" viewBox="0 0 24 24">
    <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
  </symbol>

  <!-- Часы работы -->
  <symbol id="clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  </symbol>

  <!-- Средний чек — карта -->
  <symbol id="wallet" viewBox="0 0 24 24">
    <rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>
  </symbol>

  <!-- Телефон ресторана -->
  <symbol id="phone" viewBox="0 0 24 24">
    <path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>
  </symbol>

  <!-- Дата брони, кнопка «Забронировать» -->
  <symbol id="calendar" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
  </symbol>

  <!-- Количество гостей -->
  <symbol id="users" viewBox="0 0 24 24">
    <circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 4 6"/>
  </symbol>

  <!-- Избранное (в активном состоянии заливается) -->
  <symbol id="heart" viewBox="0 0 24 24">
    <path d="M12 20s-7-4.5-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 5c-2.3 4.5-9.3 9-9.3 9z"/>
  </symbol>

  <!-- Убрать из избранного -->
  <symbol id="close" viewBox="0 0 24 24">
    <path d="M18 6L6 18M6 6l12 12"/>
  </symbol>

  <!-- Меню кабинета: профиль -->
  <symbol id="user" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
  </symbol>

  <!-- Меню кабинета: история бронирований -->
  <symbol id="list" viewBox="0 0 24 24">
    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
  </symbol>

  <!-- Меню кабинета: уведомления -->
  <symbol id="bell" viewBox="0 0 24 24">
    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
  </symbol>

  <!-- Выход из аккаунта -->
  <symbol id="logout" viewBox="0 0 24 24">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
  </symbol>

  <!-- Показать пароль -->
  <symbol id="eye" viewBox="0 0 24 24">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
  </symbol>

  <!-- Скрыть пароль — перечёркнутый глаз -->
  <symbol id="eye-off" viewBox="0 0 24 24">
    <path d="M2 12s3.5-7 10-7c2 0 3.7.6 5.1 1.5M22 12s-3.5 7-10 7c-2 0-3.7-.6-5.1-1.5"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/>
  </symbol>

  <!-- Галочка в списке преимуществ (раньше — текстовый символ «✓») -->
  <symbol id="check" viewBox="0 0 24 24">
    <path d="M4 12.5l5 5L20 6.5"/>
  </symbol>

  <!-- Тема: светлая -->
  <symbol id="sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </symbol>

  <!-- Тема: тёмная -->
  <symbol id="moon" viewBox="0 0 24 24">
    <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
  </symbol>

  <!-- Тема: как в системе (половина круга залита) -->
  <symbol id="contrast" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
  </symbol>
</svg>
