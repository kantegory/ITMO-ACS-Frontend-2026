<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ковёр — CarpetShop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav id="navbar"></nav>

    <div class="container mt-4">
      <div id="message"></div>

      <div id="not-found" class="d-none">
        <h2>Ковёр не найден</h2>
        <a href="index.html">Вернуться в каталог</a>
      </div>

      <div id="carpet-content">
        <a href="index.html">&larr; Назад в каталог</a>

        <div class="row mt-3">
          <div class="col-md-5 mb-3">
            <div id="carpet-image" class="carpet-img-big rounded"></div>
          </div>

          <div class="col-md-7">
            <h2 id="carpet-title"></h2>
            <p class="text-muted" id="carpet-category"></p>
            <p id="carpet-description"></p>

            <ul id="carpet-props"></ul>

            <p class="mb-1">Рейтинг: <span id="carpet-rating"></span></p>
            <p class="mb-3">В наличии: <span id="carpet-stock"></span></p>
            <h3 id="carpet-price"></h3>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/carpet.js"></script>
  </body>
</html>
