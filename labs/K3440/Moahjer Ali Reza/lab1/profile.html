<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Личный кабинет — CarpetShop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav id="navbar"></nav>

    <div class="container mt-4">
      <h2 class="mb-4">Профиль</h2>

      <div id="message"></div>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-info">
          <form id="profile-form" style="max-width: 400px" novalidate>
            <p class="text-muted">Email: <span id="profile-email"></span></p>
            <div class="mb-3">
              <label for="profile-name" class="form-label">Имя</label>
              <input
                type="text"
                class="form-control"
                id="profile-name"
                required
              />
              <div class="invalid-feedback">Введите имя</div>
            </div>
            <div class="mb-3">
              <label for="profile-phone" class="form-label">Телефон</label>
              <input type="tel" class="form-control" id="profile-phone" />
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <button
              type="button"
              id="delete-account-btn"
              class="btn btn-outline-danger"
            >
              Удалить аккаунт
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
