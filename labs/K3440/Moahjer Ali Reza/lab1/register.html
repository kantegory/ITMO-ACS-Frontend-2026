<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Регистрация — CarpetShop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav id="navbar"></nav>

    <div class="container mt-5" style="max-width: 400px">
      <h2 class="mb-4">Регистрация</h2>

      <div id="register-error" class="alert alert-danger d-none"></div>

      <form id="register-form" novalidate>
        <div class="mb-3">
          <label for="reg-name" class="form-label">Имя</label>
          <input type="text" class="form-control" id="reg-name" required />
          <div class="invalid-feedback">Введите имя</div>
        </div>
        <div class="mb-3">
          <label for="reg-email" class="form-label">Email</label>
          <input type="email" class="form-control" id="reg-email" required />
          <div class="invalid-feedback">Введите корректный email</div>
        </div>
        <div class="mb-3">
          <label for="reg-phone" class="form-label"
            >Телефон (необязательно)</label
          >
          <input type="tel" class="form-control" id="reg-phone" />
        </div>
        <div class="mb-3">
          <label for="reg-password" class="form-label">Пароль</label>
          <input
            type="password"
            class="form-control"
            id="reg-password"
            minlength="8"
            required
          />
          <div class="invalid-feedback">Минимум 8 символов</div>
        </div>
        <div class="mb-3">
          <label for="reg-password2" class="form-label">Повторите пароль</label>
          <input
            type="password"
            class="form-control"
            id="reg-password2"
            required
          />
          <div class="invalid-feedback">Пароли не совпадают</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          Зарегистрироваться
        </button>
      </form>

      <p class="mt-3">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
