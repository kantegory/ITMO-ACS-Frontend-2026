
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — BlueStay</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">BlueStay</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu" aria-expanded="false"
                    aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <div class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                    <a class="nav-link" href="index.html">Главная</a>
                    <a class="nav-link" href="catalog.html">Найти жильё</a>
                    <a class="nav-link" href="profile.html">Личный кабинет</a>
                    <a class="btn btn-primary" href="login.html">Войти</a>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="auth-section">
    <div class="auth-card">
        <h1>Регистрация</h1>
        <p class="auth-description">
            Создайте аккаунт, чтобы пользоваться BlueStay.
        </p>

        <div id="registerMessage" class="alert d-none" role="alert"></div>

        <p class="small text-muted">Учебная демонстрация: данные хранятся только в этом браузере.</p>

        <form id="registerForm">
            <div class="mb-3">
                <label for="registerName" class="form-label">Имя</label>
                <input type="text" class="form-control" id="registerName"
                       placeholder="Ваше имя" autocomplete="name" required>
            </div>

            <div class="mb-3">
                <label for="registerEmail" class="form-label">Электронная почта</label>
                <input type="email" class="form-control" id="registerEmail"
                       placeholder="example@mail.ru" autocomplete="email" required>
            </div>

            <div class="mb-3">
                <label for="registerPassword" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="registerPassword"
                       placeholder="Не менее 6 символов" minlength="6"
                       autocomplete="new-password" required>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Повторите пароль</label>
                <input type="password" class="form-control" id="confirmPassword"
                       placeholder="Повторите пароль" minlength="6"
                       autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Зарегистрироваться
            </button>
        </form>

        <p class="auth-footer">
            Уже есть аккаунт?
            <a href="login.html">Войти</a>
        </p>
    </div>
</main>

<footer class="site-footer">
    <div class="container text-center">
        <p class="mb-0">© 2026 BlueStay. Сервис аренды недвижимости.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
