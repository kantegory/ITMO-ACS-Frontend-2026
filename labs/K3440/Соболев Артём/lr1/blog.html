<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Статьи о питании, физической активности и восстановлении." />
    <title>Блог о здоровье и питании - Fitness Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/blog.css" />
    <link rel="stylesheet" href="css/details.css" />
    <link rel="stylesheet" href="css/accessibility.css" />
  </head>
  <body>
    <!-- Навигация страницы -->
    <div data-site-header="main"></div>
    <!-- Основное содержимое -->
    <main>
      <section class="container inner-hero">
        <h1>Блог о здоровье и питании</h1>
      </section>
      <section class="container">
        <!-- Основной список статей -->
        <div class="row g-4" id="articleGrid" aria-live="polite"><div class="col-12"><p class="empty-state" role="status">Загрузка статей...</p></div></div>
        <!-- Дополнительные статьи, открываемые кнопкой -->
        <div class="row g-4 d-none" id="moreArticles">
        </div><div class="text-center">
          <button class="btn btn-outline-dark" id="loadMoreArticles" type="button" aria-expanded="false" aria-controls="moreArticles">
            Читать больше статей
          </button>
        </div>
      </section>
    </main>
    <!-- Нижняя часть страницы -->
    <div data-site-footer="blog"></div>

    <!-- Подключение библиотек и логики страницы -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.21.0/dist/axios.min.js"></script>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
