<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Полная история завершённых тренировок пользователя." />
    <title>История тренировок - Fitness Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/account.css" />
    <link rel="stylesheet" href="css/details.css" />
    <link rel="stylesheet" href="css/accessibility.css" />
  </head>
  <body>
    <!-- Навигация страницы -->
    <div data-site-header="main"></div>

    <!-- Полная история тренировок -->
    <main class="container account-layout">
      <div class="article-back-wrap">
        <a class="article-back" href="account.html">Назад</a>
      </div>
      <section class="inner-hero">
        <h1>История ваших тренировок</h1>
      </section>
      <section class="dash-card" id="historyList" data-full-history aria-live="polite"><p class="empty-state" role="status">Загрузка истории...</p></section>
    </main>

    <!-- Нижняя часть страницы -->
    <div data-site-footer="simple"></div>

    <!-- Подключение библиотек и логики страницы -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.21.0/dist/axios.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
