<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Фитнес-платформа Fitness Platform - тренировки, планы и привычки для здоровья." />
    <title>Fitness Platform - тренировки для жизни</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/workouts.css" />
    <link rel="stylesheet" href="css/blog.css" />
    <link rel="stylesheet" href="css/accessibility.css" />
  </head>
  <body>
    <!-- Навигация страницы -->
    <div data-site-header="main" data-sticky="true"></div>
    <!-- Основное содержимое -->
    <main>
      <!-- Первый экран платформы -->
      <section class="hero container platform-hero">
        <div class="hero-copy">
          <h1>Платформа для тренировок и статей о здоровье</h1>
          <p class="platform-features-title">Возможности платформы:</p>
          <ul class="platform-features">
            <li>Тренировки</li>
            <li>Отслеживание личного прогресса</li>
            <li>Блог о здоровье и питании</li>
          </ul>
        </div>
      </section>
      <!-- Краткий список тренировок -->
      <section class="section container" id="workouts-preview">
        <div class="section-heading"><h2>Тренировки</h2></div>
        <div class="row g-4" data-workout-list><div class="col-12"><p class="empty-state" role="status">Загрузка тренировок...</p></div></div>
        <a class="all-items-button" href="workouts.html">Все тренировки</a>
      </section>
      <!-- Последние статьи -->
      <section class="section container journal-preview">
        <div class="section-heading"><h2>Блог о здоровье и питании</h2></div>
        <div class="row g-4" data-article-list><div class="col-12"><p class="empty-state" role="status">Загрузка статей...</p></div></div>
        <a class="all-items-button" href="blog.html">Все статьи</a>
      </section>
    </main>
    <!-- Нижняя часть страницы -->
    <div data-site-footer="simple"></div>

    <!-- Подключение библиотек и логики страницы -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.21.0/dist/axios.min.js"></script>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
