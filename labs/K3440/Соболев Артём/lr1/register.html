<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Регистрация в Fitness Platform." />
    <title>Регистрация - Fitness Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/accessibility.css" />
  </head>
  <body>
    <!-- Навигация страницы -->
    <div data-site-header="minimal"></div>
    <!-- Основное содержимое -->
    <main class="auth-wrap">
      <!-- Форма регистрации -->
      <div class="auth-form-side">
        <form class="auth-form" data-demo-form="register" aria-labelledby="auth-title">
          <h1 id="auth-title">Создать аккаунт</h1>
          <div class="auth-field"><label class="form-label" for="name">Имя</label><input class="form-control" id="name" type="text" autocomplete="name" placeholder="Как к тебе обращаться?" required />
          </div>
          <div class="auth-field"><label class="form-label" for="email">Электронная почта</label><input class="form-control" id="email" type="email" autocomplete="email" placeholder="name@example.com" required />
          </div>
          <div class="auth-field"><label class="form-label" for="password">Пароль</label>
            <div class="password-field">
              <input class="form-control" id="password" type="password" autocomplete="new-password" placeholder="Не менее 9 символов" minlength="9" required /><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Показать пароль">
                <svg aria-hidden="true" focusable="false">
                  <use href="assets/icons.svg#eye"></use>
                </svg>
              </button>
            </div>
          </div>
          <div class="auth-field"><label class="form-label" for="passwordConfirm">Подтвердите пароль</label>
            <div class="password-field">
              <input class="form-control" id="passwordConfirm" type="password" autocomplete="new-password" minlength="9" required aria-describedby="passwordMismatch" /><button class="password-toggle" type="button" data-password-toggle="passwordConfirm" aria-label="Показать подтверждение пароля">
                <svg aria-hidden="true" focusable="false">
                  <use href="assets/icons.svg#eye"></use>
                </svg>
              </button>
            </div>
            <small id="passwordMismatch" class="password-mismatch" hidden>Пароли не совпадают.</small>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="terms" required /><label class="form-check-label small" for="terms">Я принимаю условия использования и политику конфиденциальности</label>
          </div>
          <button class="btn btn-dark w-100" type="submit">
            Создать аккаунт
          </button>
          <div class="form-note">
            Уже зарегистрированы? <a href="login.html">Войти</a>
          </div>
          <div class="form-note home-return">
            <a href="index.html">На главную</a>
          </div>
        </form>
      </div>
    </main>

    <!-- Подключение библиотек и логики страницы -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.21.0/dist/axios.min.js"></script>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
