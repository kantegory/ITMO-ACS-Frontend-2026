<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Список тренировок с поиском и фильтрами по уровню, типу и длительности." />
    <title>Тренировки - Fitness Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/workouts.css" />
    <link rel="stylesheet" href="css/details.css" />
    <link rel="stylesheet" href="css/accessibility.css" />
  </head>
  <body>
    <!-- Навигация страницы -->
    <div data-site-header="main"></div>
    <!-- Основное содержимое -->
    <main class="container">
      <section class="inner-hero">
        <h1>Тренировки</h1>
        <p>Подберите занятие по направлению, уровню и времени.</p>
      </section>
      <!-- Поиск, фильтры и каталог -->
      <section  aria-label="Поиск и список тренировок">
        <div class="filters">
          <label class="search-box"><svg class="search-icon" aria-hidden="true" focusable="false">
              <use href="assets/icons.svg#search"></use></svg><input id="searchInput" type="search" placeholder="Название тренировки" aria-label="Поиск тренировок" /></label>
          <label class="visually-hidden" for="levelFilter">Уровень</label>
          <select id="levelFilter" class="form-select filter-select">
            <option value="">Любой уровень</option>
            <option>Начальный</option>
            <option>Средний</option>
            <option>Продвинутый</option>
          </select>
          <label class="visually-hidden" for="typeFilter">Тип тренировки</label>
          <select id="typeFilter" class="form-select filter-select" aria-label="Тип тренировки">
            <option value="">Все направления</option>
            <option>Силовая</option>
            <option>Кардио</option>
            <option>Йога</option>
          </select>
          <label class="visually-hidden" for="durationFilter">Длительность</label>
          <select id="durationFilter" class="form-select filter-select">
            <option value="">Любая длительность</option>
            <option value="20">До 20 минут</option>
            <option value="30">До 30 минут</option>
          </select>
        </div>
        <div class="row g-4" id="workoutGrid"><div class="col-12"><p class="empty-state" role="status">Загрузка тренировок...</p></div></div>
        <p id="emptyState" class="empty-state d-none" role="status" aria-live="polite">
          Тренировки не найдены. Измените условия поиска.
        </p>
      </section>
    </main>
    <!-- Нижняя часть страницы -->
    <div data-site-footer="workouts"></div>

    <!-- Подключение библиотек и логики страницы -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.21.0/dist/axios.min.js"></script>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
