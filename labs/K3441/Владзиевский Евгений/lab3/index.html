<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ключи | аренда квартир и домов без посредников</title>
  <meta name="description" content="Долгосрочная аренда квартир, комнат и домов напрямую от владельцев.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    // Тема применяется до отрисовки, иначе при загрузке мигает светлый фон
    (function () {
      var pref = 'auto';
      try { pref = JSON.parse(localStorage.getItem('klyuchi:theme')) || 'auto'; } catch (e) { /* приватный режим */ }
      var dark = pref === 'dark' ||
        (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.bsTheme = theme;
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
