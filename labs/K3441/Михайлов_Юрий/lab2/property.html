<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Объект — SpbRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar bg-white border-bottom">
    <div class="container py-2"><a class="navbar-brand brand" href="index.html">Spb<span>Rent</span></a><a
            href="search.html" class="link-gold">К поиску</a><a href="account.html" class="link-gold ms-3 d-none" data-auth-link>Личный кабинет</a><a href="#" class="link-gold ms-3 d-none" data-logout>Выйти</a></div>
</nav>
<main class="container py-5">
    <div class="row g-5 align-items-start" id="propertyDetails">
        <div class="col-lg-6">
            <div class="property-image detail-image" data-property-image></div>
        </div>
        <div class="col-lg-6"><p class="eyebrow" data-property-label></p>
            <h1 class="section-title" data-property-title></h1>
            <p class="lead" data-property-price></p>
            <p class="text-muted" data-property-meta></p>
            <p data-property-description></p>
            <button id="requestViewingButton" class="btn btn-gold" type="button">Записаться на просмотр
            </button>
            <p id="requestResult" class="text-success mt-3"></p></div>
    </div>
</main>
<div class="modal fade" id="requestModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h2 class="h5 modal-title">Заявка на просмотр</h2>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="requestForm">
                <div class="modal-body"><input class="form-control mb-3" required placeholder="Ваше имя"><input
                        class="form-control" type="tel" required placeholder="Телефон"></div>
                <div class="modal-footer">
                    <button class="btn btn-primary" type="submit">Отправить</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/properties.js"></script><script src="js/messages.js"></script><script src="js/app.js"></script>
</body>
</html>
