<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Вход - Тихий двор</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/bootstrap.bundle.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body data-page="login">
    <a class="visually-hidden-focusable" href="#main">К содержимому</a>
    <header id="site-header"></header>
    <main id="main" class="container py-5">
      <div class="row g-5 align-items-center">
        <section class="col-lg-6" aria-labelledby="login-title">
          <div>
            <p class="eyebrow">Личный кабинет</p>
            <h1 id="login-title">Рады видеть вас снова</h1>
            <p class="text-muted">Войдите, чтобы ваши планы на вечер были под рукой.</p>
            <form method="post" data-demo-form data-message="Форма проверена. Можно открыть демонстрационный профиль.">
              <div class="mb-3">
                <label class="form-label" for="login-email">Электронная почта</label>
                <input class="form-control" id="login-email" name="email" type="email"
                  autocomplete="email" placeholder="mail@example.com" required />
              </div>
              <div class="mb-4">
                <label class="form-label" for="login-password">Пароль</label>
                <input class="form-control" id="login-password" name="password" type="password"
                  autocomplete="current-password" minlength="8" aria-describedby="password-help" required />
                <p class="form-text" id="password-help">Не менее 8 символов.</p>
              </div>
              <button class="btn btn-primary w-100" type="submit">Войти</button>
              <p class="mt-3 mb-0" data-feedback role="status"></p>
            </form>
            <p class="mt-4">Еще нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
            <p class="small text-muted">Демонстрационная форма. Данные не сохраняются.</p>
            <a href="profile.html">Посмотреть пример профиля</a>
          </div>
        </section>
        <aside class="col-lg-6 d-none d-lg-block">
          <img class="img-fluid rounded-4" src="images/window.png" width="1536" height="1024"
            alt="Столик у окна в светлом зале ресторана" />
        </aside>
      </div>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
