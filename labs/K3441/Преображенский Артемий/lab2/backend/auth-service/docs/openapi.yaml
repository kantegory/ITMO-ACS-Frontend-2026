openapi: 3.0.3
info:
  title: Auth Service API
  version: 1.0.0
servers:
- url: /
tags:
- name: auth
  description: Публичные эндпоинты аутентификации
- name: service
  description: Межсервисное взаимодействие
paths:
  /api/auth/register:
    post:
      tags:
      - auth
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
  /api/auth/login:
    post:
      tags:
      - auth
      summary: Вход в систему
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
  /api/auth/me:
    get:
      tags:
      - auth
      summary: Текущий пользователь
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
  /service/users/{id}:
    get:
      tags:
      - service
      summary: Получить пользователя по id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-App-Revision:
              schema:
                type: string
              description: Source commit of the running image.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - full_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 72
          description: От 8 до 72 байт UTF-8 (ограничение bcrypt).
          x-minBytes: 8
          x-maxBytes: 72
        full_name:
          type: string
        phone:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - id
      - email
      - full_name
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
