<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>О ресторане - BaT</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/bootstrap.bundle.min.js" defer></script>
    <script src="api.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="visually-hidden-focusable" href="#main">К содержимому</a>
    <header id="site-header"></header>
    <main id="main" class="container page-shell">
      <p id="page-message" class="my-4" role="status" hidden></p>
      <button id="page-retry" class="btn btn-outline-primary mb-4" type="button" hidden>Повторить</button>
      <a class="small-copy back-link d-inline-block" href="index.html">← Все рестораны</a>
      <div id="restaurant-content" hidden>
        <div class="restaurant-heading">
          <div>
            <p class="eyebrow">
              <span data-restaurant-field="city">Санкт-Петербург</span> ·
              <span data-restaurant-field="cuisine">Европейская</span> ·
              <span data-restaurant-field="price">₽₽</span>
            </p>
            <h1 data-restaurant-field="name">BaT</h1>
            <p class="lead-copy mb-0" data-restaurant-field="description">
              Мягкий свет, натуральное дерево и тихий двор за окном.
              Здесь удобно встретиться за ужином и никуда не торопиться.
            </p>
            <p class="small-copy muted mt-3 mb-0" data-restaurant-field="address">Литейный проспект, 28</p>
          </div>
          <a id="reserve-table" class="btn btn-primary flex-shrink-0" href="index.html">Выбрать столик</a>
        </div>
        <div class="gallery" aria-label="Фотографии ресторана">
          <img data-restaurant-field="photo" src="images/window.jpg" alt="Интерьер ресторана" width="1600" height="1752" />
          <div class="gallery-side">
            <img src="images/hall.jpg" alt="Столики в основном зале" width="1600" height="1067" />
            <img src="images/alcove.jpg" alt="Столик в тихой нише" width="1600" height="1067" />
          </div>
        </div>
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="menu-tab" data-bs-toggle="tab" data-bs-target="#menu"
                    type="button" role="tab" aria-controls="menu" aria-selected="true">Меню</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews"
                    type="button" role="tab" aria-controls="reviews" aria-selected="false">Отзывы</button>
          </li>
        </ul>
        <div class="tab-content">
          <section class="tab-pane fade show active" id="menu" role="tabpanel" aria-labelledby="menu-tab" tabindex="0">
            <h2 class="mb-4">Из нашего меню</h2>
            <div id="menu-list"></div>
            <template id="menu-item">
              <article class="menu-item">
                <div><h3></h3><p></p></div>
                <strong></strong>
              </article>
            </template>
          </section>
          <section class="tab-pane fade" id="reviews" role="tabpanel" aria-labelledby="reviews-tab" tabindex="0">
            <h2 class="mb-4">Впечатления гостей</h2>
            <div id="reviews-list"></div>
            <template id="review-item">
              <article class="review">
                <div class="d-flex justify-content-between mb-3">
                  <strong></strong><span class="rating"></span>
                </div>
                <p class="mb-0"></p>
              </article>
            </template>
          </section>
        </div>
      </div>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
