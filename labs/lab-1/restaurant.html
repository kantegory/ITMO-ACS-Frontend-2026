<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ресторан — TableBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#922b21;">
  <div class="container">
    <a class="navbar-brand" href="index.html">TableBook</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Поиск ресторанов</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="nav-auth-slot"></ul>
    </div>
  </div>
</nav>

<main class="container my-5" id="restaurant-root">
  <!-- Контент подставляется скриптом js/restaurant.js -->
</main>

<!-- Модальное окно бронирования -->
<div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="booking-form">
        <div class="modal-header">
          <h5 class="modal-title">Бронирование столика</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="booking-login-warning" class="alert alert-info d-none">
            Чтобы увидеть бронь в личном кабинете, <a href="login.html">войдите в аккаунт</a>. Сейчас бронь будет сохранена анонимно.
          </div>
          <div class="mb-3">
            <label class="form-label">Дата</label>
            <input type="date" class="form-control" id="b-date" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Время</label>
            <input type="time" class="form-control" id="b-time" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Количество гостей</label>
            <input type="number" class="form-control" id="b-guests" min="1" max="20" value="2" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <textarea class="form-control" id="b-comment" rows="2" placeholder="Например: столик у окна"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-brand">Забронировать</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Toast об успешном бронировании -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="booking-toast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body">Столик успешно забронирован! Подробности — в личном кабинете.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/restaurant.js"></script>
</body>
</html>
