<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TableBook — Бронирование столиков в ресторанах</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#922b21;">
  <div class="container">
    <a class="navbar-brand" href="index.html">TableBook</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Поиск ресторанов</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center" id="nav-auth-slot"></ul>
    </div>
  </div>
</nav>

<section class="hero text-center">
  <div class="container">
    <h1 class="fw-bold display-4">Найдите столик мечты</h1>
    <p class="lead">Бронирование столиков в лучших ресторанах вашего города за пару кликов</p>
  </div>
</section>

<main class="container my-5">
  <div class="row g-4">
    <div class="col-lg-3">
      <div class="filter-sidebar">
        <h2 class="h5 mb-3">Фильтры</h2>
        <form id="filter-form">
          <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" class="form-control" id="f-name" placeholder="Например, Sakura">
          </div>
          <div class="mb-3">
            <label class="form-label">Кухня</label>
            <select class="form-select" id="f-cuisine">
              <option value="">Любая</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Расположение</label>
            <select class="form-select" id="f-city">
              <option value="">Любое</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Цена</label>
            <select class="form-select" id="f-price">
              <option value="">Любая</option>
              <option value="1">$ — Бюджетно</option>
              <option value="2">$$ — Средне</option>
              <option value="3">$$$ — Дорого</option>
              <option value="4">$$$$ — Премиум</option>
            </select>
          </div>
          <button type="submit" class="btn btn-brand w-100">Применить</button>
          <button type="button" id="f-reset" class="btn btn-outline-secondary w-100 mt-2">Сбросить</button>
        </form>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="results-count" class="text-muted"></span>
      </div>
      <div class="row g-4" id="restaurant-list"></div>
      <div id="no-results" class="alert alert-warning d-none">По вашему запросу ничего не найдено.</div>
    </div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/search.js"></script>
</body>
</html>
