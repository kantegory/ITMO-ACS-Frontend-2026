<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Аренда жилья — но сначала оплати комиссию</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">Аренда жилья</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">

            <div class="d-flex flex-row align-items-center w-100 gap-2 gap-lg-3 mt-2 mt-lg-0 flex-nowrap">

                <form class="flex-grow-1 m-0" style="min-width: 0;" onsubmit="return false">
                    <label for="search-query"></label>
                    <input type="text" class="form-control bg-light border-0 mb-0" id="search-query" placeholder="Поиск по названию...">
                </form>

                <div class="d-flex align-items-center gap-2 flex-shrink-0">
                    <a class="nav-link p-0 me-2 auth-only" href="cabinet.html">Личный кабинет</a>
                    <a class="btn btn-outline-primary btn-sm guest-only" href="login.html">Вход</a>
                    <a class="btn btn-primary btn-sm guest-only" href="register.html">Регистрация</a>
                    <button class="btn btn-outline-danger btn-sm auth-only" onclick="logout()">Выйти</button>
                </div>

            </div>

        </div>
    </div>
</nav>

<section class="hero text-center">
    <div class="container">
        <h1 class="display-5 fw-bold">Найдите идеальное жильё</h1>
        <p class="lead mb-0">Ну или останьтесь без дома(</p>
    </div>
</section>

<main class="container py-4">
    <!-- Панель фильтров -->
    <div class="filter-panel mb-4">
        <form class="row g-3 align-items-center" onsubmit="return false">
            <div class="col-md-3">
                <label class="form-label small fw-semibold" for="filter-type">Тип недвижимости</label>
                <select class="form-select" id="filter-type">
                    <option value="">Любой</option>
                    <option value="apartment">Квартира</option>
                    <option value="house">Дом</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold" for="filter-city">Город</label>
                <select class="form-select" id="filter-city">
                    <option value="">Любой</option>
                    <option value="Москва">Москва</option>
                    <option value="Санкт-Петербург">Санкт-Петербург</option>
                    <option value="Казань">Казань</option>
                    <option value="Екатеринбург">Екатеринбург</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-semibold" for="filter-price">
                    Максимальная цена: <span id="filter-price-value" class="text-primary">200 000 ₽</span>
                </label>
                <input type="range" class="form-range" id="filter-price"
                       min="10000" max="200000" step="5000" value="200000">
            </div>
            <div class="col-md-2">
                <button type="button" class="btn btn-outline-secondary w-100" id="btn-reset">
                    <i class="bi bi-x-circle"></i> Сброс
                </button>
            </div>
        </form>
    </div>

    <h5 class="mb-3">Найденные объекты</h5>
    <div class="row g-4" id="property-list"></div>
</main>

<footer class="mt-5 text-center">
    <div class="container">
        <p class="mb-0">© 2026 Аренда жилья. Лабораторная работа.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
