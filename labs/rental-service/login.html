<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Аренда жилья</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html">Аренда жилья</a>
    </div>
</nav>

<div class="container">
    <div class="card auth-card">
        <div class="card-body p-4 p-md-5">
            <h3 class="mb-1 fw-bold text-center">Вход в аккаунт</h3>
            <p class="text-muted text-center mb-4">Рады видеть вас снова</p>

            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label for="login-email" class="form-label">Email</label>
                    <input type="email" id="login-email" name="email"
                           class="form-control form-control-lg"
                           placeholder="you@example.com" required>
                    <div class="invalid-feedback">Введите корректный email.</div>
                </div>

                <div class="mb-3">
                    <label for="login-password" class="form-label">Пароль</label>
                    <input type="password" id="login-password" name="password"
                           class="form-control form-control-lg"
                           placeholder="••••••••" minlength="6" required>
                    <div class="invalid-feedback">Минимум 6 символов.</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label small" for="remember">Запомнить меня</label>
                    </div>
                    <a href="#" class="small text-decoration-none">Забыли пароль?</a>
                </div>

                <button class="btn btn-primary btn-lg w-100" type="submit">Войти</button>
            </form>

            <hr class="my-4">
            <p class="text-center mb-0">Нет аккаунта?
                <a href="register.html" class="fw-semibold text-decoration-none">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
