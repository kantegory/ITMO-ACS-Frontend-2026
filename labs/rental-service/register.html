<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — Аренда жилья</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html">Аренда жилья</a>
    </div>
</nav>

<div class="container">
    <div class="card auth-card">
        <div class="card-body p-4 p-md-5">
            <h3 class="mb-1 fw-bold text-center">Создать аккаунт</h3>
            <p class="text-muted text-center mb-4">Присоединяйтесь к Аренде жилья</p>

            <form id="register-form" novalidate>
                <div class="mb-3">
                    <label for="reg-name" class="form-label">Имя</label>
                    <input type="text" id="reg-name" name="name"
                           class="form-control form-control-lg"
                           placeholder="Иван Иванов" required>
                    <div class="invalid-feedback">Введите имя.</div>
                </div>

                <div class="mb-3">
                    <label for="reg-email" class="form-label">Email</label>
                    <input type="email" id="reg-email" name="email"
                           class="form-control form-control-lg"
                           placeholder="you@example.com" required>
                    <div class="invalid-feedback">Введите корректный email.</div>
                </div>

                <div class="mb-3">
                    <label for="reg-phone" class="form-label">Телефон</label>
                    <input type="tel" id="reg-phone" name="phone"
                           class="form-control form-control-lg"
                           placeholder="+7 (999) 000-00-00" required>
                    <div class="invalid-feedback">Введите телефон.</div>
                </div>

                <div class="mb-3">
                    <label for="reg-password" class="form-label">Пароль</label>
                    <input type="password" id="reg-password" name="password"
                           class="form-control form-control-lg" minlength="6" required>
                    <div class="invalid-feedback">Минимум 6 символов.</div>
                </div>

                <div class="mb-3">
                    <label for="reg-password2" class="form-label">Повторите пароль</label>
                    <input type="password" id="reg-password2" name="password2"
                           class="form-control form-control-lg" minlength="6" required>
                    <div class="invalid-feedback">Повторите пароль.</div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="agree" required>
                    <label class="form-check-label small" for="agree">
                        Я согласен с <a href="#" class="text-decoration-none">условиями</a>
                        и <a href="#" class="text-decoration-none">политикой</a>
                    </label>
                    <div class="invalid-feedback">Подтвердите согласие.</div>
                </div>

                <button class="btn btn-primary btn-lg w-100" type="submit">Зарегистрироваться</button>
            </form>

            <hr class="my-4">
            <p class="text-center mb-0">Уже есть аккаунт?
                <a href="login.html" class="fw-semibold text-decoration-none">Войти</a>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
