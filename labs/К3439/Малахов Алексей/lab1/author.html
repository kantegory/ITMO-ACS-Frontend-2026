<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кулинар: Вкусная лента</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="index.html" data-icon="logo">Вкусная лента</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="search.html">Рецепты</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
          </ul>
          <div class="d-flex gap-2 py-2 py-lg-0">
            <a class="btn btn-outline-primary" href="login.html">Войти</a>
            <a class="btn btn-primary" href="register.html">Регистрация</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div id="notFound" class="empty-state d-none">
      <h1 class="h3">Кулинар не найден</h1>
      <p><a href="index.html">На главную</a></p>
    </div>

    <div id="authorPage" class="d-none">
      <section class="panel mb-4">
        <div class="d-flex flex-column flex-md-row align-items-md-center gap-3">
          <span class="avatar avatar-lg" id="authorAvatar"></span>
          <div class="flex-grow-1">
            <h1 class="h3 mb-1" id="authorName"></h1>
            <p class="text-muted mb-1" id="authorMeta"></p>
            <p class="mb-0" id="authorBio"></p>
          </div>
          <button type="button" class="btn btn-primary" id="followButton">Подписаться</button>
        </div>
      </section>

      <h2 class="h4 mb-3">Рецепты автора</h2>
      <div class="row g-4" id="authorRecipes"></div>
    </div>
  </main>

  <footer class="footer py-4">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>Вкусная лента, 2026</span>
      <span>Учебный проект, ИТМО</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/author.js"></script>
</body>
</html>
