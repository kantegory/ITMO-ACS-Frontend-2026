<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9f5">
  <title>Тренировки — Качалочка</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="index">
  <a class="skip-link" href="#main">К содержимому</a>
  <header class="site-header">
    <div class="container site-width header-inner">
      <a class="wordmark" href="index.html" aria-label="Качалочка, главная"><img class="brand-logo" src="assets/images/logo.png" alt="" width="36" height="36">Качалочка</a>
      <nav class="main-nav" aria-label="Основное меню">
        <a href="index.html" aria-current="page">Тренировки</a>
        <a href="blog.html">Журнал</a>
        <a href="account.html">Личный кабинет</a>
      </nav>
      <div class="header-actions" id="header-actions"><a class="btn btn-outline-secondary" href="login.html">Войти</a></div>
    </div>
  </header>
  <main id="main">
<section class="hero" aria-labelledby="hero-title">
  <div class="container site-width hero-layout">
    <div class="hero-copy">
      <h1 id="hero-title">Тренировки<br>дома, если нет денег на gym</h1>
      <p>Спускайся вниз, подберем тебе упражнения</p>
      <a class="btn btn-primary" href="#catalog">Подобрать тренировку</a>
    </div>
    <img class="hero-image" src="assets/images/hero.webp" alt="Бегунья на дорожке в парке" width="1279" height="720" fetchpriority="high">
  </div>
</section>
<section id="catalog" class="container site-width catalog" aria-labelledby="catalog-title">
  <h2 id="catalog-title">Каталог тренировок</h2>
  <p class="muted mb-4">Найдите занятие по типу нагрузки, уровню и длительности.</p>
  <form id="filters" class="filter-bar row g-3" role="search" aria-label="Поиск тренировок">
    <div class="col-12 col-md-4"><label class="form-label" for="search">Поиск</label><input type="search" class="form-control" id="search" name="search" placeholder="Название или упражнение"></div>
    <div class="col-6 col-md"><label class="form-label" for="type">Тип</label><select class="form-select" id="type" name="type"><option value="">Все типы</option><option>Силовые</option><option>Кардио</option><option>Растяжка</option></select></div>
    <div class="col-6 col-md"><label class="form-label" for="level">Уровень</label><select class="form-select" id="level" name="level"><option value="">Любой</option><option>Начальный</option><option>Средний</option></select></div>
    <div class="col-6 col-md"><label class="form-label" for="duration">Длительность</label><select class="form-select" id="duration" name="duration"><option value="">Любая</option><option value="short">До 15 мин</option><option value="medium">16–25 мин</option><option value="long">От 26 мин</option></select></div>
  </form>
  <div class="result-line"><p id="result-count" role="status"></p><button type="reset" form="filters" class="text-button" id="reset-filters" hidden>Сбросить фильтры</button></div>
  <div id="workouts" class="row g-4"></div>
  <noscript>Включите JavaScript, чтобы пользоваться каталогом тренировок.</noscript>
</section>
  </main>
  <footer class="site-footer">
    <div class="container site-width footer-inner"><a class="wordmark" href="index.html">Качалочка</a></div>
  </footer>
</body>
</html>
