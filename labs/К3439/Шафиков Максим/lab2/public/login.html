<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f9f5">
  <title>Вход — Качалочка</title>
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-page="login">
  <a class="skip-link" href="#main">К содержимому</a>
  <header class="site-header">
    <div class="container site-width header-inner">
      <a class="wordmark" href="index.html" aria-label="Качалочка, главная"><img class="brand-logo" src="assets/images/logo.png" alt="" width="36" height="36">Качалочка</a>
      <nav class="main-nav" aria-label="Основное меню">
        <a href="index.html">Тренировки</a>
        <a href="blog.html">Журнал</a>
        <a href="account.html">Личный кабинет</a>
      </nav>
      <div class="header-actions" id="header-actions"><a class="btn btn-outline-secondary" href="login.html">Войти</a></div>
    </div>
  </header>
  <main id="main">
<section class="container site-width page-content">
  <div class="auth-panel">
    <h1>Войти</h1>
    <p class="muted">Откройте свой план тренировок и историю занятий.</p>
    <form id="auth-form" data-mode="login">
      <div class="mb-3"><label class="form-label" for="email">Электронная почта</label><input id="email" name="email" class="form-control" type="email" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="password">Пароль</label><input id="password" name="password" maxlength="128" class="form-control" type="password" autocomplete="current-password" required></div>
      <p id="auth-error" class="form-error" role="alert"></p>
      <button class="btn btn-primary w-100" type="submit">Войти</button>
    </form>
    <p class="auth-switch">Впервые здесь? <a id="auth-alternate" href="register.html">Зарегистрироваться</a></p>
    <p class="auth-note">Учебный режим. Используйте тестовые данные. Профиль хранится на учебном сервере.</p>
  </div>
</section>
  </main>
  <footer class="site-footer">
    <div class="container site-width footer-inner"><a class="wordmark" href="index.html">Качалочка</a></div>
  </footer>
</body>
</html>
