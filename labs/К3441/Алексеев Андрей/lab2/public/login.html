<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Вектор — каталог вакансий и личный кабинет для поиска работы.">
  <title>Вход | Вектор</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="assets/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body class="d-flex flex-column min-vh-100" data-view="login">
  <a class="skip-link visually-hidden-focusable" href="#main">К содержимому</a>
  <header class="site-header">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3 py-3">
      <a class="wordmark" href="index.html"><span aria-hidden="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#briefcase"></use></svg></span> Вектор</a>
      <nav class="site-nav d-flex align-items-center flex-wrap" aria-label="Главное меню">
        <a href="index.html">Вакансии</a>
        <div class="d-flex align-items-center gap-2">
          <label for="theme-choice">Тема</label>
          <select class="form-select form-select-sm w-auto" id="theme-choice">
            <option value="system">Системная</option>
            <option value="light">Светлая</option>
            <option value="dark">Тёмная</option>
          </select>
        </div>
        <span id="account-nav" class="d-flex align-items-center flex-wrap gap-2"></span>
      </nav>
    </div>
  </header>
  <main class="container flex-grow-1 py-4 py-md-5" id="main" tabindex="-1">
    <section class="panel page-narrow mx-auto p-4 p-md-5">
      <h1 class="h2 mb-4">Вход</h1>
      <form id="auth-form" aria-describedby="error">
        <label class="form-label" for="email">Почта</label>
        <input class="form-control mb-3" id="email" name="email" type="email" autocomplete="email" maxlength="150" required>
        <label class="form-label" for="password">Пароль</label>
        <input class="form-control mb-2" id="password" name="password" type="password" autocomplete="current-password"  maxlength="64" required>

        <p class="text-danger" id="error" role="alert"></p>
        <button class="btn btn-primary w-100 mt-2" type="submit">Войти</button>
      </form>
      <p class="muted mt-4 mb-0">Впервые здесь? <a href="register.html">Зарегистрироваться</a></p>
    </section>
  </main>
  <footer class="site-footer mt-4">
    <div class="container py-4">Вектор · Учебный сервис поиска работы</div>
  </footer>
</body>
</html>
