<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — VICE BITES</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Главная навигация">
      <div class="container">
        <a class="navbar-brand brand" href="index.html">
          <span class="brand-mark" aria-hidden="true"></span>
          VICE BITES
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
            <li class="nav-item"><a class="nav-link" href="index.html">Рецепты</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Кабинет</a></li>
            <li class="nav-item d-none" data-nav="user"><a class="nav-link" href="profile.html"></a></li>
            <li class="nav-item" data-nav="login"><a class="nav-link" href="login.html">Вход</a></li>
            <li class="nav-item ms-lg-2" data-nav="register">
              <a class="btn btn-vice btn-vice-primary" href="register.html">Регистрация</a>
            </li>
            <li class="nav-item ms-lg-2 d-none" data-nav="logout">
              <a class="btn btn-vice btn-vice-teal" href="#" data-logout>Выйти</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="auth-wrap">
    <div class="container">
      <section class="auth-card" aria-labelledby="reg-title">
        <h1 id="reg-title">Регистрация</h1>
        <p class="text-muted mb-4">Заведи профиль кулинара и публикуй свои рецепты.</p>

        <div class="alert alert-danger d-none" id="reg-alert" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="reg-name">Имя</label>
            <input class="form-control" type="text" id="reg-name" name="name" required autocomplete="name" placeholder="Луна Ривера">
          </div>
          <div class="mb-3">
            <label class="form-label" for="reg-email">Email</label>
            <input class="form-control" type="email" id="reg-email" name="email" required autocomplete="email" placeholder="you@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label" for="reg-password">Пароль</label>
            <input class="form-control" type="password" id="reg-password" name="password" required autocomplete="new-password" minlength="6" placeholder="минимум 6 символов">
          </div>
          <div class="mb-3">
            <label class="form-label" for="reg-password2">Повтор пароля</label>
            <input class="form-control" type="password" id="reg-password2" name="password2" required autocomplete="new-password" minlength="6">
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="terms" required>
            <label class="form-check-label" for="terms">
              Согласен с правилами кухни (демо-чекбокс)
            </label>
          </div>
          <button type="submit" class="btn btn-vice btn-vice-primary w-100">Создать аккаунт</button>
        </form>

        <p class="auth-alt">
          Уже есть аккаунт? <a href="login.html">Войти</a>
        </p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="row gy-3 align-items-center">
        <div class="col-md-6">
          <div class="brand">VICE BITES</div>
          <p class="footer-neon mb-0">NEON KITCHEN</p>
        </div>
        <div class="col-md-6 text-md-end">
          <p class="small mb-0 opacity-75">ЛР2 · ИТМО ACS Frontend 2026</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
