<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VICE BITES — обмен рецептами и кулинарные блоги.">
    <title>VICE BITES — обмен рецептами</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vice-theme');
          if (t !== 'sunset' && t !== 'night') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'night'
              : 'sunset';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
